spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/linguaai
    username: linguaai
    password: password
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    contexts: dev
    default-schema: public
    enabled: true